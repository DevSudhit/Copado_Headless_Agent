<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Copado-inspired DevOps icon: pipeline flow with eye (trinetra) -->
  <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <!-- Eye shape (trinetra = third eye) -->
  <path d="M5 12C5 12 8 7.5 12 7.5C16 7.5 19 12 19 12C19 12 16 16.5 12 16.5C8 16.5 5 12 5 12Z" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <circle cx="12" cy="12" r="2.5" fill="currentColor"/>
  <!-- Pipeline arrows -->
  <line x1="4" y1="20" x2="8" y2="17" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
  <line x1="16" y1="17" x2="20" y2="20" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
</svg>
